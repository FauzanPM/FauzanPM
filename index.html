<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <h2>NamaKamu</h2>
</nav>

<section class="hero">
    <h1>Hi, Saya Nama Kamu</h1>
    <p>Web Developer • UI Designer</p>
</section>

<section class="projects">
    <h2>My Projects</h2>

    <div class="project-grid">

        <!-- Project 1 -->
        <div class="project-card">
            <img src="img/project1.jpg" alt="Project 1">
            <div class="card-content">
                <h3>Project 1</h3>
                <p>Deskripsi singkat mengenai project pertama.</p>
                <div class="card-actions">
                    <button onclick="openPDF('pdf/project1.pdf')">Preview</button>
                    <a href="pdf/project1.pdf" target="_blank">PDF</a>
                </div>
            </div>
        </div>

        <!-- Project 2 -->
        <div class="project-card">
            <img src="img/project2.jpg" alt="Project 2">
            <div class="card-content">
                <h3>Project 2</h3>
                <p>Deskripsi singkat mengenai project kedua.</p>
                <div class="card-actions">
                    <button onclick="openPDF('pdf/project2.pdf')">Preview</button>
                    <a href="pdf/project2.pdf" target="_blank">PDF</a>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- Modal PDF -->
<div class="modal" id="pdfModal">
    <div class="modal-content">
        <span class="close" onclick="closePDF()">&times;</span>
        <iframe id="pdfFrame"></iframe>
    </div>
</div>

<footer>
    <p>© 2026 Nama Kamu</p>
</footer>

<script src="script.js"></script>
</body>
</html>
