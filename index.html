<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <h2>FauzanPM</h2>
</nav>

<section class="hero">
    <h1>Fauzan Prima Mukti</h1>
    <p>Portofolio | DevOps</p>
</section>

<section class="projects">
    <h2>My Projects</h2>

    <div class="project-grid">

        <!-- Project 1 -->
        <div class="project-card">
            <img src="img/project1.png" alt="Project 1">
            <div class="card-content">
                <h3>DumbMerch</h3>
                <p>Implementasi infrastruktur end-to-end untuk platform E-Commerce</p>
                <div class="card-actions">
                    <button onclick="openPDF('pdf/project1.pdf')">Preview</button>
                    <a href="pdf/project1.pdf" target="_blank">PDF</a>
                </div>
            </div>
        </div>

        <!-- Project 2 -->
        <div class="project-card">
            <img src="img/project2.png" alt="Project 2">
            <div class="card-content">
                <h3>WaysHub</h3>
                <p>Implementasi Infrastruktur Hybrid platform video streaming</p>
                <div class="card-actions">
                    <button onclick="openPDF('pdf/project2.pdf')">Preview</button>
                    <a href="pdf/project2.pdf" target="_blank">PDF</a>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- Modal PDF -->
<div class="modal" id="pdfModal">
    <div class="modal-content">
        <span class="close" onclick="closePDF()">&times;</span>
        <iframe id="pdfFrame"></iframe>
    </div>
</div>

<footer>
    <a href="https://github.com/FauzanPM/automation" target="_blank">Github</a>
</footer>

<script src="script.js"></script>
</body>
</html>
