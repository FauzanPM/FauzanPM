<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d0b" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          if (localStorage.getItem('fauzanpm-theme') === 'light') theme = 'light';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'light' ? '#f5f6ee' : '#080d0b';
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f5f6ee' : '#080d0b';
      })();
    </script>
    <meta
      name="description"
      content="Fauzan Prima Mukti — DevOps engineer building thoughtful infrastructure, automated delivery pipelines, and observable systems. Based in Batam, Indonesia."
    />
    <meta property="og:title" content="Fauzan Prima Mukti — Infrastructure, made human." />
    <meta
      property="og:description"
      content="Cloud infrastructure. Automated delivery. Systems you can understand. Explore selected DevOps projects by Fauzan Prima Mukti."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fauzan Prima Mukti — DevOps Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This portfolio needs JavaScript for its interactive experience. Contact Fauzan Prima Mukti at
      fauzanprimamukti@gmail.com or <a href="%BASE_URL%pdf/cv.pdf">download the CV</a>.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
